[alembic]
script_location = alembic
# Puts the project root on sys.path so revisions can import from `app` — several
# import `app.platform.db.types` for the dialect-portable column types. Without
# it every one of those fails with `ModuleNotFoundError: No module named 'app'`
# unless the caller happens to have exported PYTHONPATH, which neither the CI
# migrations job nor the Docker entrypoint does.
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://localhost:5432/magai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
