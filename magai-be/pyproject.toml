[project]
name = "magai-be"
version = "1.0.0"
description = "MagnetAI backend - Automated Lead Magnet Generator"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "pydantic[email]>=2.10.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.42,<3.0.0",
    "alembic>=1.16.4,<2.0.0",
    "psycopg[binary]>=3.2.9,<4.0.0",
    "httpx>=0.28.0,<1.0.0",
    "google-antigravity>=0.1.0",
    "google-auth>=2.38.0,<3.0.0",
    "google-genai>=1.0,<1.5",
    "stripe>=11.0.0,<12.0.0",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.5.0",
    "redis[hiredis]>=5.2.1,<6.0",
    # Auth: Argon2id password hashing (OWASP default) and JWT handling.
    "argon2-cffi>=23.1.0,<26.0.0",
    "pyjwt>=2.10.0,<3.0.0",
    # Fernet, for the third-party integration credentials we must be able to
    # decrypt (see app/platform/security/secrets.py). Already present via the
    # Google client libraries, but declared directly because we import it.
    "cryptography>=44.0.0",
    # Observability: /metrics endpoint. Import-guarded, but shipped by default so
    # production always has metrics available.
    "prometheus-client>=0.21.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "httpx>=0.28.0,<1.0.0",
    "aiosqlite>=0.21.0,<1.0.0",
    "ruff>=0.12.0,<1.0.0",
    "mypy>=1.17.0,<2.0.0",
]
# NB: no types-redis. redis>=5 ships its own py.typed, and the third-party stubs
# are pinned to 4.6 — they shadow the real package and report methods that do
# exist (e.g. Redis.aclose) as missing.
# Error reporting. Optional so self-hosted deployments need not pull it in.
sentry = ["sentry-sdk[fastapi]>=2.20.0,<3.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/platform/db/models/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "S",      # flake8-bandit (security)
    "ASYNC",  # async correctness
    "T20",    # no stray print()
    "RUF",    # ruff-specific
]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented idiom.
    "S105",  # Hard-coded-password heuristic fires on token type literals.
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts and hard-coded credentials.
"tests/*" = ["S101", "S105", "S106"]
# Migrations are generated-ish and reviewed as SQL, not as library code.
"alembic/*" = ["E501"]
# Agent prompts are prose data, not code. Re-wrapping a prompt to satisfy a line
# length changes the text the model actually receives, so leave them intact.
"app/platform/pipeline/states/*" = ["E501"]
# This module contains the shipped JSX source for the provider-degraded build.
# Reflowing Tailwind class strings to satisfy Python line length changes the
# generated artifact rather than improving the Python around it.
"app/platform/pipeline/fallback_widget.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without bundled type information, plus sentry-sdk, which
# lives behind an optional extra and so is legitimately absent in most installs.
module = [
    "google.antigravity.*",
    "celery.*",
    "argon2.*",
    "prometheus_client.*",
    "sentry_sdk.*",
]
ignore_missing_imports = true
