name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Test-only values. Real secrets are never needed by CI: every external call is
  # stubbed, and the suite runs against in-memory SQLite.
  MAGAI_SECRET_KEY: ci-secret-key-long-enough-for-hs256-token-signing
  MAGAI_ENVIRONMENT: development

jobs:
  backend-lint:
    name: Backend · lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magai-be
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: magai-be/uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

  backend-test:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magai-be
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: magai-be/uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: magai-be/coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Backend · migrations against Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magai-be
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: magai
          POSTGRES_PASSWORD: magai
          POSTGRES_DB: magai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U magai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAGAI_DATABASE_URL: postgresql+asyncpg://magai:magai@localhost:5432/magai
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: magai-be/uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Applying then reverting proves both directions work, so a bad deploy can
      # actually be rolled back rather than only discovering that during an incident.
      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Verify downgrade path
        run: uv run alembic downgrade base

      - name: Re-apply migrations
        run: uv run alembic upgrade head

      # Catches models drifting out of sync with the migration history.
      - name: Check for un-migrated model changes
        run: |
          uv run alembic check || {
            echo "::error::Models differ from migrations. Generate a revision with 'alembic revision --autogenerate'."
            exit 1
          }

  frontend:
    name: Frontend · lint, types & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magai-fe
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: magai-fe/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  ops:
    name: Ops · alert rules & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # An alert rule with a typo is worse than no alert: it looks like coverage
      # and fires never. promtool catches that at review time.
      - name: Validate Prometheus alert rules

        run: |
          PROM_VERSION=2.55.1
          curl -sSL -o prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf prom.tar.gz
          "./prometheus-${PROM_VERSION}.linux-amd64/promtool" check rules ops/prometheus/alerts.yml

      - name: Shell-check ops scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck ops/scripts/*.sh

      - name: Ensure ops scripts are executable
        run: |
          for script in ops/scripts/*.sh; do
            test -x "$script" || {
              echo "::error::$script is not executable (run: chmod +x $script)"
              exit 1
            }
          done

  docker:
    name: Docker · images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./magai-be
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./magai-fe
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
